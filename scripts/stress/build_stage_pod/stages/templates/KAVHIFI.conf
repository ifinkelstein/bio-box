# Stage KAVHIFI: Kavagutti et al. 2023's PacBio HiFi freshwater ecogenomics support data (Figshare 20431332,
# Support-data.gz; the phages of the same archive are in LRV1): 2,214 bacterial MAGs (kind="prokaryote", genetic code
# screened per genome: all 2,214 are code 11) and 3,309 NCLDV contigs (kind="virus", gv-meta; DEC-65 (1) exact DTRs
# trimmed, 11 circular). CC BY 4.0, redistributable: true (as sources.yaml records it). The 28 eukaryotic MAGs wait
# for card C-60 and the 10 mitochondrial genomes for a later organelle stage (no per-record genetic code in the
# archive); both are kept byte for byte beside the stage; card C-80, DEC-79, DEC-80.
# PRE-BUILD TEMPLATE (promoted to stages/ by card A-29, which adds the EXPECT lines of the r26.11.5 chain).
# Read by stage_driver.sh through `stage_est.py conf`; every value is from the note below unless said.
STAGE=KAVHIFI
NOTE=planning/measurements/2026-11-26_kavhifi_inph2604_inputs.md
# Staged on the pod (measured, wilkcomp02, 2026-11-26): the two FASTA files on /stor/scratch/Wilke/if2453/
# bio-box-staging/KAVHIFI/, metadata on /tmp/if2453/c80/KAVHIFI/; card A-29 copies them into INPUTS (objects.json
# already names that path).
INPUTS=/tmp/if2453/s2/inputs/KAVHIFI
SUM=1efb3b86fc62f5cdf18b397cf561b0ddea0c029c61beba37739650afd7e5ef6c genomes.json
SUM=b3461aaad23eb1d380f7135045b75ae5555343939cc38a10617a502edaf50dcf objects.json
SUM=5c310ee70e183ecf4a5132fd85a2d738824a93d521e3d75bc38471bc3942dcd5 kavagutti_hifi_bacterial_mags.fna
SUM=02275a2997b6dee6989cd0df16f7a7bbc3979fba8fcadc2798fe9232eaa4c6c1 kavagutti_hifi_ncldv.fna
# Depth and CRISPR: card C-80 (a MAG set as NX1, DEC-75 (2)): called depth (single mode per genome, its code from the
# screen; the NCLDV records are called by gv-meta in any case) and the default CRISPR producer.
DEPTH=called
CRISPR=yes
# Build order (plan 2026-11-26_r26_11_5_staging_plan.md §5): directly after MVEUKV.
AFTER=MVEUKV
# Contigs of KAVHIFI held by the root's stored stages and the r26.11.4 stages, by build order (measured, wilkcomp02,
# 2026-11-26; total 16 contigs, 138,278 bp). None is held by LR2, SAG1, NX1, GV1, MV2 or MVEUKV (exact contig_uid).
# Card A-29 adds the r26.11.5 chain.
EXPECT=held_by SPX1 16 planning/measurements/2026-11-26_kavhifi_inph2604_inputs.md
# No least contig length (MAGs and NCLDV records stay whole, DEC-60 (1)). No JUDGE or ACCEPTED line.
