# Stage DPN1: DPANN archaeal genomes and DPANN mobile elements, from tower batch 2: the Nanobdellota genomes of
# Zenodo 20174424 (Nanobdellota_Zen.zip: 208 closed, 51 open, 243 NCBI comparison genomes; genome FASTA only, not the
# 8.4 GB of structures, orthologue tables and annotations) and the 3,662 DPANN genomes and 26 DPANN virus and
# unclassified MGE contigs of Zenodo 11215303. Deduplicated with skani at ANI >= 96 % and aligned fraction >= 50 %
# against card C-75's GlobDB r226 archaea where a stage holds the reference (707 removed), then within the stage (1,680
# removed): 1,777 genomes (143 closed, staged circular under DEC-65 (1)) and the 26 MGEs (kind="virus": their table has
# no class); nothing removed for being listed in GTDB R232 or GlobDB r232 (r232_status.tsv); redistributable: false
# (DEC-80: the licence is the job list's CC BY 4.0, no provider read); card C-78, DEC-79.
# PRE-BUILD TEMPLATE (promoted to stages/ by card A-29, which adds the EXPECT lines of the r26.11.5 chain).
