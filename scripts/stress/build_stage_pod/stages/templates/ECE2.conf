# elements-pro/pro-623-elements.fna), from tower:.../sources_incoming/ECE2/ (batch 1). kind="plasmid", code 11;
# Inocles circular by DEC-65 (1) (all 29 without a terminal repeat: untrimmed), elements linear and byte-identical;
# 945 genomes, 945 contigs, 17,676,120 bp, measured on wilkcomp02, 2026-11-26; card C-70, DEC-59, DEC-69, DEC-80.
# PRE-BUILD TEMPLATE (promoted to stages/ by card A-29).
