# Stage GV1: every genome of GVMAGs V2's all_18kgenomes_fna.tar.gz (card C-48c part 3).
# Read by stage_driver.sh through `stage_est.py conf`; every value is from the notes below unless said.
STAGE=GV1
NOTE=planning/measurements/2026-11-20_virus_gv1_inputs.md
NOTE=planning/measurements/2026-11-20_virus_v2_gv1_inputs.md
# 2026-11-20_virus_gv1_inputs.md §2: the staged inputs on the pod
INPUTS=/tmp/if2453/s2/inputs/GV1
# §2, table of /tmp/if2453/s2/inputs/GV1/ (measured, wilkcomp02, 2026-11-20, inputs_SUMS beside the note): the two
# lists build-stage reads and the FASTA object objects.json names
SUM=a86ce75b88da4c31e7016b0c90e6b6967a1d525604d8c5247d94bfeeec595ced genomes.json
SUM=2eaadb35ecc8eec0d12fcbcb69cccdb2ae48758506f53383426caa3e066b18fb objects.json
SUM=568f3a312fd78d03544792bfb3a89bde708591865065d72c62fc6c0dbdc0028b gvmags_v2_all_18kgenomes.fna
# Depth, library and CRISPR: card C-48c (2) stages GV1 "for full annotated build"; §5 costs `--depth annotated` as
# ingest, gv-meta gene calling, the Pfam 38.2 scan and both CRISPR producers, as stage V1 of the same card was built.
DEPTH=annotated
LIBRARY=pfam 38.2 gathering
CRISPR=yes
# The orchestrator's decision (2) of the note's preamble: V2 is built before GV1, so V2 owns the 17,664 contigs they
# share (measured, §3) and GV1 lists them as second genomes (DEC-26, DEC-27).
AFTER=V2
# §3, table "What GV1 shares by contig_uid" (measured, overlap.json): the contigs of GV1 each earlier stage holds;
# `estimate` stops when the root says otherwise
EXPECT=held_by V2 17664 planning/measurements/2026-11-20_virus_gv1_inputs.md
EXPECT=held_by H1 6 planning/measurements/2026-11-20_virus_gv1_inputs.md
# §5 and STATUS row C-48c (3): the code's gene-call estimate (354 CPU-minutes, derived) plans the batches; the step's
# run records are judged against 236 CPU-minutes (derived: (15 + 1.23 x 2.80 x 4,108.28) / 60), the rate measured on
# 695 sampled genomes rounded up. Card B-59 was withdrawn on 2026-11-20 and leaves this figure standing.
JUDGE=genecall 236 planning/measurements/2026-11-20_virus_gv1_inputs.md
# No least contig length (every contig as the archive gives it, decision (4)). No ACCEPTED line.
