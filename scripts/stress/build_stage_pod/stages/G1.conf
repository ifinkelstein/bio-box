# Read by stage_driver.sh through `stage_est.py conf`; every value is from the note below unless said (card A-17).
STAGE=G1
NOTE=planning/measurements/2026-11-18_globdb_inputs.md
# §4.1: the staged inputs on the pod (the 7,139 .fa.gz objects that objects.json names are under
# /tmp/if2453/s3/globdb/genomes/G1/files/, outside INPUTS)
INPUTS=/tmp/if2453/s2/inputs/G1
# §4.1, table of /tmp/if2453/s2/inputs/G1/ (measured, wilkcomp02, 2026-11-18, G1/inputs_SUMS beside the note): the two
# lists build-stage reads
SUM=cf0740cbd3bf3896a17b3c38fff8bdc3bc7fa34e15d477318dac884335f25fdd genomes.json
SUM=90f2f3d43c9313988abd665b9f471907e6fbf2a1b7cd4c86c3014cadbaee6fe6 objects.json
# Depth, library and CRISPR: the note costs depth annotated and depth called (§4.4, §5) and chooses neither; the
# orchestrator decided, for the PI to overrule (planning/tasks/STATUS.md, open item 22, its last paragraph): annotated,
# Pfam 38.2 in full, --crispr, as every stage built so far (both CRISPR producers).
DEPTH=annotated
LIBRARY=pfam 38.2 gathering
CRISPR=yes
# §4.2 (1) (measured, G1/est.json and G1/shared_records.tsv): the contigs of G1 that stored stages hold, P2 1 (2,165,038
# bp), P4 6 (3,175,875 bp), H1 1 (358,784 bp); `estimate` stops when the root says otherwise.
EXPECT=held_by P2 1 planning/measurements/2026-11-18_globdb_inputs.md
EXPECT=held_by P4 6 planning/measurements/2026-11-18_globdb_inputs.md
EXPECT=held_by H1 1 planning/measurements/2026-11-18_globdb_inputs.md
# No least contig length (§4.1 stages every record of the 7,139 genomes). No AFTER: the note names no stage G1 must
# follow (its 13 contigs shared with PL2's inputs, §4.2 (2), belong to whichever is built first; DEC-26).
# No JUDGE line: the note judges every step by the code's estimate (§4.3: gene calling 12.9% under the code's rate,
# within 20%; CRISPR 21.4% under). Its `igr` + `tapes` figure (§4.4: about 1.7 CPU-minutes at P2's rate, 15 to 30 by
# its estimate of a sort of 1.23 M contigs) is under DEC-43's 24 and no JUDGE line can name those steps; either step
# reaching 24 CPU-minutes fails the check (`not_judged_of_judged_size`). Every object is .fa.gz: `estimate` and the rate
# guard price ingest as build-stage does, with card B-61's gzip term (44.131 CPU-minutes, derived in
# planning/measurements/2026-11-21_ingest_terms.md §4).
# DEC-68: accepts G1's pre-B-66 default CRISPR record (66.117 CPU-min, run before O(1)-stage SeqStore.get, against
# card B-66's post-fix estimate of 38.363 CPU-min; planning/measurements/2026-11-22_b66_seqstore_and_crispr_contigs.md).
ACCEPTED=crispr-minced-0.4.2-w8-nr3-r23x47-s26x50 66.117 38.363 DEC-68
