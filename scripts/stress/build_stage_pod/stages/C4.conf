# Stage C4: S2C phase 2, stage 4 of 6 (GTDB R226 complete prokaryotic genomes, up to 20 per species; card C-36, DEC-62).
# Read by stage_driver.sh through `stage_est.py conf`; every value is from the notes below unless said (card A-18).
STAGE=C4
NOTE=planning/measurements/2026-11-15_s2c_phase2_inputs.md
NOTE=planning/measurements/2026-11-21_a18_c_stage_confs.md
# 2026-11-15_s2c_phase2_inputs.md §2: the staged inputs on the pod (the 1,972 .fna.gz objects that objects.json names
# are under /tmp/if2453/s2/phase2/, outside INPUTS)
INPUTS=/tmp/if2453/s2/inputs/C4
# 2026-11-15_s2c_phase2_inputs.md §2, table of /tmp/if2453/s2/inputs/ (measured, wilkcomp02, 2026-11-15, inputs/SUMS;
# re-verified 2026-11-21 in 2026-11-21_a18_c_stage_confs.md): the two lists build-stage reads
SUM=d8fb4df529fa81b55a6df805af038bba13cd2d8d7486104328fc7b2d0738c1e8 genomes.json
SUM=46891a790939c115f5578f9219661d4f671269a4ffa5a2ddba0625b2368e2988 objects.json
# Depth, library and CRISPR: DEC-62 scans C1 to C4 and C6 with Pfam 38.2 in full (--depth annotated --library pfam 38.2
# <hmm> gathering --crispr), as C5 was built.
DEPTH=annotated
LIBRARY=pfam 38.2 gathering
CRISPR=yes
# 2026-11-21_a18_c_stage_confs.md §1 (measured against /tmp/if2453/r10/root holding S1, P1 to P6, H1, PL1, V1, C5):
# contigs of C4 held by earlier stored stages; `estimate` stops when the root says otherwise. Note: the 1 contig
# (820 bp, NZ_AP025650.1) shared between C4 and C5's inputs is owned by PL1 (stored before C5), so C5 holds 0.
EXPECT=held_by P2 5 planning/measurements/2026-11-21_a18_c_stage_confs.md
EXPECT=held_by P3 5 planning/measurements/2026-11-21_a18_c_stage_confs.md
EXPECT=held_by P4 4 planning/measurements/2026-11-21_a18_c_stage_confs.md
EXPECT=held_by PL1 1918 planning/measurements/2026-11-21_a18_c_stage_confs.md
# No least contig length (prokaryote complete genomes, DEC-60). No AFTER: 0 contigs shared pairwise among C1, C2, C3,
# C4 and C6, and all owning stages are already stored. No JUDGE or ACCEPTED line: every step is judged by the code's
# own estimate (ingest includes card B-61's gzip term via card A-17).
