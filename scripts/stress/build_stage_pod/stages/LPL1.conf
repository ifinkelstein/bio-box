# Stage LPL1: Eukaryotic mitochondrial & cytoplasmic linear plasmids (invertrons: Neurospora
# kalilo/maranhar, Podospora pAL2-1, Claviceps pClK1, Zea mays S-2, Physarum mF; yeast
# cytoplasmic DPBB killer plasmids: Kluyveromyces pGKL1/pGKL2, Pichia, Debaryomyces; plus
# fungal/plant mitochondrial plasmids; redistributable: true; byte-identical with 0 TIR trims
# under DEC-65 (2); kind="plasmid" meta mode; card C-59a, DEC-69).
# Read by stage_driver.sh through `stage_est.py conf`; every value is from the note below unless said.
STAGE=LPL1
NOTE=planning/measurements/2026-11-24_lpl1_o2_inputs.md
# Staged inputs on the pod (measured wilkcomp02 2026-11-24):
# genomes.json, objects.json, and 1 NCBI GenBank/RefSeq eukaryotic plasmid .fna.gz object.
INPUTS=/tmp/if2453/s2/inputs/LPL1
SUM=a55a922e66d0b0c10d1bf68ee5ff37cf78695f4fe2060e698040817f8c2e4c44 genomes.json
SUM=c52817b7b9cbd7a4a2239655aeda5e1ae8e396c488b5fad4b344c7bcc2c07832 objects.json
SUM=accaf9e2e5dbad860f942145dde76b97cdbaa49338dd732ab15c7fcd2a1a3e64 ncbi_eutils_c59a_lpl1.fna.gz
# Depth, library and CRISPR: card C-59a (DEC-69) — full Pfam 38.2 scan (gathering) and both CRISPR producers.
DEPTH=annotated
LIBRARY=pfam 38.2 gathering
CRISPR=yes
# Build order (card C-59a, DEC-69): built after O2.
AFTER=O2
# Contigs of LPL1 held by earlier stages in build order (S1..SPX1, V2, PL2, PL3, CG1, MGE1, SAT1, MGE2, ECE1, O1, O2;
# measured, wilkcomp02, 2026-11-24; total 165 contigs, 1,381,141 bp). `estimate` stops on mismatch.
EXPECT=held_by PL2 159 planning/measurements/2026-11-24_lpl1_o2_inputs.md
EXPECT=held_by O2 6 planning/measurements/2026-11-24_lpl1_o2_inputs.md
# No least contig length (DEC-69: linear/mitochondrial plasmids stay whole). No JUDGE or ACCEPTED line.
