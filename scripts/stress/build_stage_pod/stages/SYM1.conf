# 131 code 4; redistributable: true; card C-58, DEC-69).
# Read by stage_driver.sh through `stage_est.py conf`; every value is from the note below unless said.
STAGE=SYM1
NOTE=planning/measurements/2026-11-24_c58_sags_symbionts_niche.md
# Staged inputs on the pod (measured wilkcomp02 2026-11-24):
# genomes.json, objects.json, and 1 consolidated deterministic .fna.gz object (68.6 MB on disk).
INPUTS=/tmp/if2453/s2/inputs/SYM1
SUM=e649e4a45e38b4b24f0ec5438b7e10b4c7dd70faeba1f6e396e0499c21560527 genomes.json
SUM=fbcd27988f602867ba22c7f0daf238c7c59b3dd307a0b70fd44d6597af6d5635 objects.json
SUM=268dcde2ed88421d24c90916c776e5b5746c12860c79a906613009828eef68d7 sym1_endosymbionts.fna.gz
# Depth, library and CRISPR: card C-58 (DEC-69) — full Pfam 38.2 scan (gathering) and both CRISPR producers.
DEPTH=annotated
LIBRARY=pfam 38.2 gathering
CRISPR=yes
# Build order (card C-58, DEC-69; aligned into linear r26.11.4 chain by card A-26): built after LPL1
# (O1, O2, LPL1 hold 0 contigs of SYM1; measured, wilkcomp02, 2026-11-24).
