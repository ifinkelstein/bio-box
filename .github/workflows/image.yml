name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ifinkelstein/bio-box

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Dockerfile
          target: test
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}-test:${{ github.sha }},${{ env.IMAGE }}-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build and push runtime image
        id: runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          cache-from: type=gha
      - name: tests inside the image (R0-R2)
        run: docker run --rm ${{ env.IMAGE }}-test:${{ github.sha }} pytest -q
      - name: doctor inside the image
        run: docker run --rm ${{ env.IMAGE }}:${{ github.sha }} python -m biobox.doctor
      - name: native tools inside the image
        run: |
          docker run --rm ${{ env.IMAGE }}:${{ github.sha }} mmseqs version
          docker run --rm ${{ env.IMAGE }}:${{ github.sha }} hmmsearch -h
          docker run --rm ${{ env.IMAGE }}:${{ github.sha }} cmsearch -h
      - name: record digest
        run: echo "runtime digest ${{ steps.runtime.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
