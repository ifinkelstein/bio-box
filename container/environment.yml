# Conda layer of the bio-box image: native binaries that pip cannot provide.
# Versions are the newest on conda-forge/bioconda as of 2026-10-29. Python
# packages come from uv.lock (see Dockerfile).
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.14
  - uv
  - mmseqs2=18.8cc5c   # >= 18-8cc5c required for the clusterupdate fix (issue #961)
  - hmmer=3.4
  - infernal=1.1.5
  - samtools=1.25      # with htslib bgzip; oracle for R-03 slices and R-07 (.fai/.gzi accepted)
  - prodigal=2.6.3     # test oracle only (card D-03): never used to produce outputs; approved by the PI 2026-11-09
  - matplotlib-base=3.11.2  # nbr flanks --figure (card W-27), the uv.lock version; approved by the PI 2026-11-12
  - skani=0.4.0        # ANI for the S2C phase-2 diversity pick (DEC-31, card C-27); bioconda linux-64 build hec9b1f2_0
