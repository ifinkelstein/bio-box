[project]
name = "bio-box"
version = "0.0.1"
description = "Staged, content-addressed corpus of prokaryotic and viral genomes for neighborhood, fusion and search workflows"
requires-python = ">=3.11"
dependencies = [
    "blake3>=1",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pyhmmer>=0.12.3",
    "pyrodigal>=3",
    "pyrodigal-gv>=0.3",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "hypothesis>=6",
    "polars>=2.1.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biobox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "r0: static checks on registries, recipes and manifests (TEST_ARCHITECTURE §8)",
    "r2: micro-corpus and micro-S0 fixture builds (TEST_ARCHITECTURE §8)",
    "r3: golden set with real tools; needs BIOBOX_GOLDEN_DIR (TEST_ARCHITECTURE §8)",
]
