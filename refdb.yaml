# Reference databases (planning/preflight_gaps.md §4; frozen for S0-S3 by DEC-12).
# Versioned URLs, never "current". sha256 values are filled by the first download on the pod
# and then enforced; `upstream_md5` is the provider's own checksum where one is published.
# Files live in the data root under l0/refdb/<name>/<version>/ (DEPLOYMENT-AND-MALLEABILITY.md §3.9).
version: 1
databases:
  - name: pfam
    version: "38.2"
    released: 2026-01
    models: 30134
    url: https://ftp.ebi.ac.uk/pub/databases/Pfam/releases/Pfam38.2/Pfam-A.hmm.gz
    file: Pfam-A.hmm.gz
    upstream_md5: 7ab3c4e215d0daaea3004e37c4e24f8a
    sha256: null
    cutoff: gathering        # Pfam GA lines
    license: CC0
    used_by: [O-SCAN]
  - name: ncbifam
    version: "20.0"
    released: 2026-06-23
    models: 18950
    url: https://ftp.ncbi.nlm.nih.gov/hmm/20.0/hmm_PGAP.HMM.tgz
    file: hmm_PGAP.HMM.tgz
    sha256: null
    cutoff: trusted          # PGAP applies the TC lines
    license: public domain (NCBI)
    used_by: [O-SCAN]
  - name: rfam
    version: "15.1"
    released: 2026-01
    url: https://ftp.ebi.ac.uk/pub/databases/Rfam/15.1/Rfam.cm.gz
    file: Rfam.cm.gz
    sha256: null
    cutoff: gathering        # Rfam GA lines (Infernal --cut_ga)
    license: CC0
    used_by: [O-SCAN (ncRNA), O-ARRAY]
pending:
  - name: phrogs
    note: >-
      phrogs.lmge.uca.fr served an expired TLS certificate on 2026-10-30, so nothing was
      downloaded (TLS checks are not bypassed). Needed from S1 (phage and plasmid proteins);
      retry, or use an archived copy with a published checksum.
