  - name: mgnify_api
    what: MGnify API v1 listings of its assemblies, assembly analyses, studies and samples (JSON, no sequence); card C-43
    url: https://www.ebi.ac.uk/metagenomics/api/v1/{endpoint}?format=json&page_size=250&page={n}
    endpoints:
      - assemblies   # ERZ accession, wgs-accession, runs and samples inline (51,739 published by the API's own count, 2026-11-16)
      - analyses?experiment_type=assembly   # MGYA with study, sample, assembly inline (55,420 by the API's count)
      - studies   # MGYS with biome lineages inline (5,203 by the API's count)
      - samples?experiment_type=assembly   # sample with biome and study inline
    paging: follow `links.next` as the API returns it until it is null; page_size is a request, the API may cap it
    checksum: none published; our sha256 of every page in the fetch log
    limits: one connection; at most 2 requests per second; stop after 5 refusals in a row (HTTP 403, 429, 500, 502, 503, 504)
    license: >-
      EMBL-EBI terms of use (https://www.ebi.ac.uk/about/terms-of-use/, read 2026-11-16): "EMBL-EBI itself places no
      additional restrictions on the use or redistribution of the data"; attribution expected; the original data may
      be subject to rights claimed by third parties
    redistributable: true (as stated by EMBL-EBI; third-party rights aside)
    approved: under DEC-50 (card C-43, 2026-11-16)
  - name: ena_portal_tables
    what: ENA Portal API tables of metagenome read runs and metagenome WGS sets (TSV, no sequence); card C-43, to link samples to runs and to give bases
    url_count: https://www.ebi.ac.uk/ena/portal/api/count?result={result}&query={query}
    url: https://www.ebi.ac.uk/ena/portal/api/search?result={result}&query={query}&fields={fields}&limit=0&format=tsv
    tables:
      - result: read_run
        query: library_source="METAGENOMIC" AND library_strategy!="AMPLICON"
        fields: run_accession,sample_accession,secondary_sample_accession,study_accession,secondary_study_accession,base_count,library_strategy,instrument_platform,tax_id,scientific_name,first_public
      - result: wgs_set
        query: tax_tree(408169)   # NCBI taxon "metagenomes"; holds bins as well as primary assemblies, told apart by assembly_type
        fields: wgs_set,assembly_accession,base_count,run_accession,sample_accession,secondary_sample_accession,study_accession,tax_id,scientific_name,first_public,assembly_type
      - result: assembly   # every INSDC assembly of a metagenome taxon, with or without a WGS set (MGnify's are mostly without)
        query: tax_tree(408169)
        fields: assembly_accession,assembly_type,base_count,run_accession,sample_accession,secondary_sample_accession,study_accession,wgs_set,center_name,tax_id,scientific_name,first_created
      - result: read_run   # the runs of named samples, whatever their library source or strategy
        url_form: https://www.ebi.ac.uk/ena/portal/api/search?result=read_run&includeAccessionType=sample&includeAccessions={comma-separated sample accessions, at most 300}&fields=run_accession,sample_accession,secondary_sample_accession,study_accession,base_count,library_source,library_strategy,tax_id,scientific_name&limit=0&format=tsv
        samples: the INSDC sample accessions (SAMEA, SAMN, SAMD, ERS, SRS, DRS) of units the first read_run table did not link
    checksum: none published; our sha256 with the date; the row count is checked against the count endpoint
    limits: one connection; one request at a time; stop after 5 refusals in a row; a table over 20 GB is not fetched (the count is read first)
    license: EMBL-EBI terms of use, as for mgnify_api; the records are INSDC (public)
    redistributable: true
    approved: under DEC-50 (card C-43, 2026-11-16)
