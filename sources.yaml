  - name: spire_study_api
    what: SPIRE v1 per-study sample tables (no sequence), the "Download Table Data" link of each study page; card C-43
    url_studies: https://spire.embl.de/studies   # HTML page; the list `studiesData` in it names every study and its sample count
    url: https://spire.embl.de/spire/api/study/{study}?format=tsv   # {study} from that list, URL-encoded
    files: the studies page and one TSV per study; sizes not stated by the provider (recorded on fetch)
    checksum: none published; our sha256 of every file in the fetch log
    limits: one connection; at most 1 request per second; stop after 5 refusals in a row (HTTP 403, 429, 503)
